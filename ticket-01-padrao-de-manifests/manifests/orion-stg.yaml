apiVersion: v1
kind: Namespace
metadata:
  name: orion-stg
  labels:
    app: orion-stg
    app.kubernetes.io/name: orion-stg
    app.kubernetes.io/instance: orion-stg
    app.kubernetes.io/part-of: orion
    app.kubernetes.io/managed-by: platform
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: orion-web
  namespace: orion-stg
  labels:
    app: orion-web
    app.kubernetes.io/name: orion-web
    app.kubernetes.io/instance: orion-stg
    app.kubernetes.io/part-of: orion
    app.kubernetes.io/managed-by: platform
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orion-web
  namespace: orion-stg
  labels:
    app: orion-web
    app.kubernetes.io/name: orion-web
    app.kubernetes.io/instance: orion-stg
    app.kubernetes.io/part-of: orion
    app.kubernetes.io/managed-by: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orion-web
  template:
    metadata:
      labels:
        app: orion-web
        app.kubernetes.io/name: orion-web
        app.kubernetes.io/instance: orion-stg
        app.kubernetes.io/part-of: orion
        app.kubernetes.io/managed-by: platform
    spec:
      serviceAccountName: orion-web
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: orion-web
        image: fabricioveronez/fake-shop@sha256:07db4334f5f2bb330f0f342a81ad203bb21b770b8d7a27c90edb2261fea34e2f
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 5000
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext: &id002
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 10001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        env:
        - name: DB_HOST
          value: postgres
        - name: DB_PORT
          value: '5432'
        - name: DB_NAME
          value: app
        - name: DB_USER
          value: app
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: database-auth
              key: password
        - name: PROMETHEUS_MULTIPROC_DIR
          value: /tmp
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        readinessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 5
        livenessProbe:
          tcpSocket: &id001
            port: http
          periodSeconds: 10
        startupProbe:
          tcpSocket: *id001
          periodSeconds: 2
          failureThreshold: 60
      volumes:
      - name: tmp
        emptyDir: {}
      initContainers:
      - name: aguardar-postgres
        image: postgres:16.6-alpine
        command:
        - sh
        - -c
        - until pg_isready -h postgres -U app -d app; do sleep 2; done
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
        securityContext: *id002
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
---
apiVersion: v1
kind: Service
metadata:
  name: orion-web
  namespace: orion-stg
  labels:
    app: orion-web
    app.kubernetes.io/name: orion-web
    app.kubernetes.io/instance: orion-stg
    app.kubernetes.io/part-of: orion
    app.kubernetes.io/managed-by: platform
spec:
  selector:
    app: orion-web
  ports:
  - name: http
    port: 80
    targetPort: http
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres
  namespace: orion-stg
  labels:
    app: postgres
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: orion-stg
    app.kubernetes.io/part-of: orion
    app.kubernetes.io/managed-by: platform
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: orion-stg
  labels:
    app: postgres
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: orion-stg
    app.kubernetes.io/part-of: orion
    app.kubernetes.io/managed-by: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        app.kubernetes.io/name: postgres
        app.kubernetes.io/instance: orion-stg
        app.kubernetes.io/part-of: orion
        app.kubernetes.io/managed-by: platform
    spec:
      serviceAccountName: postgres
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: postgres
        image: postgres:16.6-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - name: db
          containerPort: 5432
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 10001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        env:
        - name: POSTGRES_DB
          value: app
        - name: POSTGRES_USER
          value: app
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: database-auth
              key: password
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: data
          mountPath: /var/lib/postgresql/data
        - name: run
          mountPath: /var/run/postgresql
        readinessProbe:
          exec: &id001
            command:
            - pg_isready
            - -U
            - app
            - -d
            - app
          periodSeconds: 3
        livenessProbe:
          exec: *id001
          periodSeconds: 3
        startupProbe:
          exec: *id001
          periodSeconds: 2
          failureThreshold: 60
      volumes:
      - name: tmp
        emptyDir: {}
      - name: data
        emptyDir: {}
      - name: run
        emptyDir: {}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: orion-stg
  labels:
    app: postgres
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: orion-stg
    app.kubernetes.io/part-of: orion
    app.kubernetes.io/managed-by: platform
spec:
  selector:
    app: postgres
  ports:
  - name: db
    port: 5432
    targetPort: db
