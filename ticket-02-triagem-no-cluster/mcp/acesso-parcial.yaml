apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-ro
  namespace: acesso-parcial
rules:
- apiGroups:
  - ''
  - apps
  resources:
  - pods
  - pods/log
  - services
  - events
  - deployments
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-ro
  namespace: acesso-parcial
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: platform-ro
subjects:
- kind: ServiceAccount
  name: platform-ro
  namespace: default
