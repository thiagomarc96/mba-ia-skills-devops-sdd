apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-ro
  namespace: default
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: desafio03-platform-ro
rules:
  - apiGroups: ['']
    resources: [namespaces]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: desafio03-platform-ro
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: desafio03-platform-ro
subjects:
  - kind: ServiceAccount
    name: platform-ro
    namespace: default
